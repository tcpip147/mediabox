[workspace]
resolver = "2"
members = [
    "crates/mediabox",
    "crates/mux",
    "crates/rtp",
    "crates/rtsp_client"
]
default-members = ["crates/mediabox"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
bytes = "1.12.1"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.dev]
incremental = true
